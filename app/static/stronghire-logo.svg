<svg xmlns="http://www.w3.org/2000/svg" width="800" height="800" viewBox="0 0 800 800">
  <defs>
    <!-- Squircle Clip Path so both halves get rounded corners -->
    <clipPath id="squircle">
      <rect width="800" height="800" rx="160" ry="160"/>
    </clipPath>
  </defs>

  <!-- Split Background inside Squircle -->
  <g clip-path="url(#squircle)">
    <!-- Left Half: Deep Pitch Black -->
    <rect width="400" height="800" fill="#000000"/>
    <!-- Right Half: Clean White -->
    <rect x="400" width="400" height="800" fill="#ffffff"/>

    <!-- Typography: Pure Bold SH (Inter / SF Pro Display) -->
    <text x="400" y="400" text-anchor="end" dominant-baseline="central" dx="-14" 
          font-family="'Inter', -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Helvetica Neue', Arial, sans-serif" 
          font-size="380" font-weight="900" fill="#ffffff">S</text>
    <text x="400" y="400" text-anchor="start" dominant-baseline="central" dx="14" 
          font-family="'Inter', -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Helvetica Neue', Arial, sans-serif" 
          font-size="380" font-weight="900" fill="#000000">H</text>

    <!-- Subtle framing border on the right half so white edge is defined against white pages -->
    <rect width="794" height="794" x="3" y="3" rx="158" fill="none" stroke="#d4d4d8" stroke-width="12"/>
  </g>
</svg>
